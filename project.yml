name: QuickShareConvert

options:
  bundleIdPrefix: com.agartner
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Signing/identity is driven by Config/Base.xcconfig, which pulls in each
# developer's git-ignored Config/Local.xcconfig (DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX).
# Nothing personal lives in this file or in git.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # Shared, cross-platform engine + models. This is the piece that makes the
  # future macOS app cheap: the app and both extensions only host UI + glue.
  ConvertKit:
    type: framework
    platform: iOS
    sources:
      - ConvertKit/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ConvertKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES

  QuickShareConvert:
    type: application
    platform: iOS
    sources:
      - QuickShareConvert
    dependencies:
      - target: ConvertKit
        embed: true
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert
        INFOPLIST_FILE: QuickShareConvert/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickShareConvert/QuickShareConvert.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      # Extension links ConvertKit but does NOT embed it; the host app embeds it
      # and the extension resolves it via @rpath at runtime.
      - target: ConvertKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements

  # Logic + integration tests for the engine (no host app needed).
  ConvertKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ConvertKitTests
    dependencies:
      - target: ConvertKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ConvertKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuickShareConvert:
    build:
      targets:
        QuickShareConvert: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
  ConvertKit:
    build:
      targets:
        ConvertKit: all
        ConvertKitTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ConvertKit
      targets:
        - ConvertKitTests
