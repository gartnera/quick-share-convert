name: QuickShareConvert

options:
  bundleIdPrefix: com.agartner
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Signing/identity is driven by Config/Base.xcconfig, which pulls in each
# developer's git-ignored Config/Local.xcconfig (DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX).
# Nothing personal lives in this file or in git.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # Shared, cross-platform engine + models. This is the piece that makes the
  # future macOS app cheap: the app and both extensions only host UI + glue.
  ConvertKit:
    type: framework
    platform: iOS
    sources:
      - ConvertKit/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ConvertKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES

  QuickShareConvert:
    type: application
    platform: iOS
    sources:
      - QuickShareConvert
      - Shared
    dependencies:
      - target: ConvertKit
        embed: true
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert
        INFOPLIST_FILE: QuickShareConvert/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickShareConvert/QuickShareConvert.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      # Extension links ConvertKit but does NOT embed it; the host app embeds it
      # and the extension resolves it via @rpath at runtime.
      - target: ConvertKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements

  # MARK: macOS
  # Same engine + shared UI. The app does the conversion; two extensions hand
  # files to it: Share (Share menus) and Action (Finder › Quick Actions).
  ConvertKitMac:
    type: framework
    platform: macOS
    sources:
      - ConvertKit/Sources
    settings:
      base:
        PRODUCT_NAME: ConvertKit
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ConvertKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES

  QuickShareConvertMac:
    type: application
    platform: macOS
    sources:
      - QuickShareConvertMac
      - Shared
      - QuickShareConvert/ConversionController.swift
      - QuickShareConvert/StatusViews.swift
      - QuickShareConvert/Assets.xcassets
    dependencies:
      - target: ConvertKitMac
        embed: true
      - target: ShareExtensionMac
        embed: true
      - target: ActionExtensionMac
        embed: true
    settings:
      base:
        PRODUCT_NAME: QuickShareConvert
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert
        INFOPLIST_FILE: QuickShareConvertMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickShareConvertMac/QuickShareConvertMac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES

  ShareExtensionMac:
    type: app-extension
    platform: macOS
    sources:
      - MacExtensions/ExtensionViewController.swift
      - MacExtensions/Share
      - Shared
    dependencies:
      - target: ConvertKitMac
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ShareExtension
        INFOPLIST_FILE: MacExtensions/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacExtensions/MacExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  ActionExtensionMac:
    type: app-extension
    platform: macOS
    sources:
      - MacExtensions/ExtensionViewController.swift
      - MacExtensions/Action
      - Shared
    dependencies:
      - target: ConvertKitMac
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ActionExtension
        INFOPLIST_FILE: MacExtensions/Action/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacExtensions/MacExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  # Logic + integration tests for the engine (no host app needed).
  ConvertKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ConvertKitTests
    dependencies:
      - target: ConvertKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).quickshareconvert.ConvertKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuickShareConvertMac:
    build:
      targets:
        QuickShareConvertMac: all
    run:
      config: Debug
    archive:
      config: Release
  QuickShareConvert:
    build:
      targets:
        QuickShareConvert: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
  ConvertKit:
    build:
      targets:
        ConvertKit: all
        ConvertKitTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ConvertKit
      targets:
        - ConvertKitTests
